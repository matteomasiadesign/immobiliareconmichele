name: Promemoria incarichi in scadenza

# Ogni lunedi' alle 7:00 (ora italiana d'estate: il cron di GitHub e' UTC).
# Si puo' lanciare anche a mano dalla scheda Actions, utile per provarlo.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  avvisa:
    runs-on: ubuntu-latest
    # Portato a livello di job perche' il contesto "secrets" non si puo'
    # leggere dentro la condizione "if" di uno step: cosi' invece si puo'.
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cerca gli incarichi in scadenza
        id: scadenze
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/incarichi-in-scadenza.mjs

      # Gli step successivi girano solo se c'e' davvero qualcosa da dire e
      # se la posta e' stata configurata: un promemoria non configurato non
      # deve far fallire la Action ogni lunedi'.
      - name: Manda l'email
        if: ${{ steps.scadenze.outputs.count != '' && env.MAIL_USERNAME != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Gestionale Immobiliare con Michele
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: "[Gestionale] ${{ steps.scadenze.outputs.subject }}"
          body: ${{ steps.scadenze.outputs.body }}
